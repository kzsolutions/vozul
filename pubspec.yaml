name: voz_ul
description: "VozUL - Sistema de Denúncias Académicas da Universidade Licungo"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # Supabase
  supabase_flutter: ^2.8.0
  
  # State Management
  provider: ^6.1.0
  
  # Routing
  go_router: ^14.0.0
  
  # UI
  fl_chart: ^0.69.0
  cached_network_image: ^3.4.0
  shimmer: ^3.0.0
  
  # File handling
  image_picker: ^1.1.0
  file_picker: ^13.0.0
  path: ^1.9.0
  
  # Utils
  intl: ^0.19.0
  url_launcher: ^6.3.0
  uuid: ^4.5.0
  
  # Local Storage
  shared_preferences: ^2.3.0
  
  # PDF generation
  pdf: ^3.11.0
  printing: ^5.13.0
  
  # CSV
  csv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image: ^4.3.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
